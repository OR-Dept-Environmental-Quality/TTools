[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ttools"
version = "9.3"
description = "TTools is a collection of python tools to sample and assemble stream channel and land cover geospatial data for input into the Heat Source model, Washington Department of Ecology's Shade model, or the shade input file for CE-QUAL-W2"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
authors = [
    {name = "Ryan Michie", email = "ryan.michie@deq.oregon.gov"},
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
open = [
    "fiona>=1.10.1",
    "geopandas>=1.1.3,<1.2",
    "pandas>=2.0.2",
    "pyproj>=3.7.2",
    "rasterio>=1.4.3,<1.5",
    "shapely>=2.1.2"
]

[project.urls]
Repository = "https://github.com/OR-Dept-Environmental-Quality/TTools"

[tool.setuptools.packages.find]
include = ["ttools*"]
